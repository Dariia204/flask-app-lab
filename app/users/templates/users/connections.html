
{% extends "base.html" %}

{% block content %}

<a href="{{ url_for('users.public_profile', user_id=user.id) }}"
   class="btn btn-outline-secondary mb-3">
    ← До профілю
</a>

<h2 class="mb-4">{{ heading }} — {{ user.username }}</h2>

<div class="list-group">

    {% for person in users %}

    <a href="{{ url_for('users.public_profile', user_id=person.id) }}"
       class="list-group-item list-group-item-action
              d-flex align-items-center gap-3">

        <div class="rounded-circle bg-primary text-white
                    d-flex align-items-center justify-content-center"
             style="width: 45px; height: 45px;">
            {{ person.username[0]|upper }}
        </div>

        <div>
            <strong>{{ person.full_name or person.username }}</strong>

            <div class="text-muted">
                @{{ person.username }}
            </div>
        </div>

    </a>

    {% else %}

    <div class="alert alert-info">
        Список поки що порожній.
    </div>

    {% endfor %}

</div>

{% endblock %}
