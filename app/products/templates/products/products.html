{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4 text-primary">Каталог товарів</h1>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for product in products %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text text-muted">{{ product.content[:80] }}...</p>
                <p class="fs-4 fw-bold text-success">${{ product.price }}</p>
                <a href="{{ url_for('products.product_detail', product_id=product.id) }}" class="btn btn-outline-primary">
                    Детальніше
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
