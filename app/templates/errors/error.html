
{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="text-center mx-auto"
         style="max-width: 600px; padding: 60px 20px;">

        <div class="text-primary fw-bold"
             style="font-size: 110px; line-height: 1;">
            {{ code }}
        </div>

        <h1 class="fw-bold mt-4">
            {{ title }}
        </h1>

        <p class="text-muted fs-5 mt-3">
            {{ message }}
        </p>

        <a href="{{ url_for('posts.all_posts') }}"
           class="btn btn-primary btn-lg mt-3">
            Повернутися до публікацій
        </a>

        <p class="text-muted mt-4">
            SocialSpace
        </p>

    </div>

</div>

{% endblock %}
