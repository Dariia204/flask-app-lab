{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm p-4">
    <div class="mb-3">
        <a href="{{ url_for('products.product_list') }}" class="btn btn-secondary btn-sm">&larr; Назад до каталогу</a>
    </div>
    <h1 class="text-primary mb-3">{{ product.name }}</h1>
    <p class="fs-5">{{ product.content }}</p>
    <p class="fs-3 fw-bold text-success">Ціна: ${{ product.price }}</p>
</div>
{% endblock %}
