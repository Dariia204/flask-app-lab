{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm text-center">
            <h2 class="mb-4">Login</h2>
            <form action="{{ url_for('users.login') }}" method="post">
                <div class="mb-3 text-start">
                    <label for="username" class="form-label">User name</label>
                    <input type="text" name="username" class="form-control" id="username" placeholder="Введіть 'admin'" required>
                </div>
                <div class="mb-3 text-start">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="password" placeholder="Введіть '1234'" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
