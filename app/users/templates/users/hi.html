{% extends 'base.html' %}

{% block content %}
<div class="row">
    <!-- Вертикальне меню -->
    <div class="col-md-3 mb-4">
        <div class="list-group">
            <a href="{{ url_for('users.greetings', name='John', age=30) }}" class="list-group-item list-group-item-action">Greet John</a>
            <a href="{{ url_for('users.admin') }}" class="list-group-item list-group-item-action">Admin</a>
        </div>
    </div>

    <!-- Основний контент -->
    <div class="col-md-9">
        <div class="card p-4 shadow-sm">
            <h1 class="display-5 text-primary mb-3">Hello :)</h1>
            
            <p class="fs-4">
                <strong>User:</strong> {{ name }}
            </p>

            {% if age %}
                <p class="fs-5 text-success">
                    <strong>Age:</strong> {{ age }}
                </p>
            {% else %}
                <p class="fs-5 text-danger">
                    <strong>Age:</strong> Not provided
                </p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
